<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironhouse Strength Co. — Intake Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0D0D0F;color:#F2F2F0;font-family:'Archivo',sans-serif;padding:70px 20px 90px}
  a.back{position:fixed;top:16px;left:16px;z-index:20;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8E8E8A;text-decoration:none;letter-spacing:.06em;border:1px solid #2E2E32;background:#141417;padding:8px 14px;border-radius:100px}
  a.back:hover{color:#C6F24E;border-color:#C6F24E}
  .inner{max-width:640px;margin:0 auto}

  .brandbar{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #C6F24E;padding-bottom:14px;margin-bottom:38px;gap:12px;flex-wrap:wrap}
  .brand{font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
  .brandsub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#C6F24E;letter-spacing:.1em}

  h1{font-size:clamp(36px,8vw,60px);font-weight:900;line-height:.94;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:16px}
  h1 em{font-style:normal;color:#C6F24E}
  .lede{font-size:15px;line-height:1.55;color:#8E8E8A;max-width:400px;margin-bottom:40px}

  .stepline{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5A5A57;letter-spacing:.08em;margin-bottom:10px;display:flex;gap:20px;flex-wrap:wrap}
  .stepline b{color:#C6F24E;font-weight:500}

  .blk{border-top:1px solid #232326;padding:28px 0}
  .blk-t{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#C6F24E;text-transform:uppercase;margin-bottom:20px}

  .f{margin-bottom:26px}
  .f:last-child{margin-bottom:0}
  label.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#C7C7C2;margin-bottom:9px}

  input[type=text],input[type=email],input[type=tel]{
    width:100%;background:transparent;border:none;border-bottom:1.5px solid #2E2E32;
    color:#F2F2F0;font-family:'Archivo',sans-serif;font-size:17px;font-weight:500;
    padding:10px 0;outline:none;transition:border-color .18s}
  input::placeholder{color:#45454A}
  input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{border-bottom-color:#C6F24E}

  select{
    width:100%;-webkit-appearance:none;appearance:none;
    background-color:#16161A;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%23C6F24E' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
    border:1.5px solid #2E2E32;border-radius:4px;
    color:#F2F2F0;font-family:'Archivo',sans-serif;font-size:16px;font-weight:500;
    padding:14px 42px 14px 15px;outline:none;cursor:pointer}
  select:focus{border-color:#C6F24E}
  select option{background:#16161A;color:#F2F2F0}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{position:relative;display:block;cursor:pointer}
  .opt input{position:absolute;opacity:0;width:0;height:0}
  .opt .face{
    border:1.5px solid #2E2E32;padding:17px 16px;font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;
    align-items:center;gap:10px;transition:.16s;color:#C7C7C2}
  .opt:hover .face{border-color:#4A4A4E}
  .opt .face i{font-family:'JetBrains Mono',monospace;font-size:10px;font-style:normal;opacity:.45}
  .opt input:checked + .face{border-color:#C6F24E;color:#C6F24E;background:rgba(198,242,78,.07)}
  .opt input:focus-visible + .face{outline:2px solid #C6F24E;outline-offset:2px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#2E2E32;outline:none;margin-top:6px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#C6F24E;cursor:pointer;border:none}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#C6F24E;cursor:pointer;border:none}
  .ticks{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:#5A5A57;margin-top:12px}

  .go{width:100%;margin-top:36px;background:#C6F24E;color:#0D0D0F;border:none;padding:20px;
    font-family:'Archivo',sans-serif;font-size:15px;font-weight:900;text-transform:uppercase;
    letter-spacing:.1em;cursor:pointer;transition:.16s}
  .go:hover{background:#D7FF63}
</style>
</head>
<body>
<a class="back" href="index.html">← ALL SAMPLES</a>

<form class="inner" onsubmit="return false">
  <div class="brandbar">
    <div class="brand">Ironhouse</div>
    <div class="brandsub">STRENGTH CO. / EST 2019</div>
  </div>

  <h1>Start your<br><em>first block.</em></h1>
  <p class="lede">Six weeks of coached training. Tell us where you're at and we'll build the programme around it.</p>

  <div class="stepline"><span><b>01</b> YOU</span><span>02 GOALS</span><span>03 SCHEDULE</span></div>

  <div class="blk">
    <div class="blk-t">Who's training</div>
    <div class="f"><label class="lbl" for="n">Full name</label><input id="n" type="text" placeholder="Marcus Ellery"></div>
    <div class="f"><label class="lbl" for="e">Email</label><input id="e" type="email" placeholder="marcus@email.com"></div>
    <div class="f"><label class="lbl" for="p">Mobile</label><input id="p" type="tel" placeholder="+44 7700 900123"></div>
  </div>

  <div class="blk">
    <div class="blk-t">Primary goal — pick one</div>
    <div class="opts">
      <label class="opt"><input type="radio" name="goal" checked><span class="face">Build strength <i>01</i></span></label>
      <label class="opt"><input type="radio" name="goal"><span class="face">Lose fat <i>02</i></span></label>
      <label class="opt"><input type="radio" name="goal"><span class="face">Compete <i>03</i></span></label>
      <label class="opt"><input type="radio" name="goal"><span class="face">Rebuild <i>04</i></span></label>
    </div>
  </div>

  <div class="blk">
    <div class="blk-t">Training experience</div>
    <input type="range" min="0" max="10" value="6" step="1">
    <div class="ticks"><span>NEVER LIFTED</span><span>3 YRS</span><span>10 YRS+</span></div>
  </div>

  <div class="blk">
    <div class="blk-t">Availability</div>
    <div class="f">
      <label class="lbl" for="s1">Sessions per week</label>
      <select id="s1">
        <option>3 sessions — most popular</option>
        <option>2 sessions</option>
        <option>4 sessions</option>
        <option>5+ sessions</option>
      </select>
    </div>
    <div class="f">
      <label class="lbl" for="s2">Preferred time</label>
      <select id="s2">
        <option>Early morning (5–8am)</option>
        <option>Midday (11am–2pm)</option>
        <option>Evening (5–9pm)</option>
        <option>Flexible</option>
      </select>
    </div>
  </div>

  <button class="go" type="submit">Claim my slot</button>
</form>
</body>
</html>
